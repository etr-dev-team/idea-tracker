<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ideas</title>
    <meta name="description" content="Capture and review ideas, fast." />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ideas" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img src="./icons/icon.svg" alt="" width="28" height="28" />
          <h1>Ideas</h1>
        </div>
        <div class="topbar-actions">
          <button id="install" class="btn btn-ghost" type="button" hidden>Install</button>
          <button id="theme" class="btn btn-icon" type="button" aria-label="Switch theme">
            <span class="icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <main>
        <form id="composer-form" class="composer" autocomplete="off">
          <label class="sr-only" for="composer">New idea</label>
          <textarea
            id="composer"
            rows="2"
            placeholder="Drop an idea…"
            enterkeyhint="enter"
            spellcheck="true"
          ></textarea>
          <div class="composer-row">
            <span id="composer-hint" class="hint">Enter to save · Shift+Enter for a new line</span>
            <button class="btn btn-primary" type="submit">Save</button>
          </div>
        </form>

        <div class="toolbar">
          <label class="sr-only" for="search">Search ideas</label>
          <input id="search" type="search" placeholder="Search ideas…" autocomplete="off" />
          <span id="count" class="count" aria-live="polite"></span>
        </div>

        <ul id="list" class="list"></ul>

        <div id="empty" class="empty" hidden>
          <p class="empty-title">No ideas yet</p>
          <p class="empty-text">Type above and press Enter. Everything stays on this device.</p>
        </div>

        <footer class="footer">
          <div class="footer-actions">
            <button id="export" class="btn btn-ghost" type="button">Export</button>
            <button id="importBtn" class="btn btn-ghost" type="button">Import</button>
            <input id="importFile" type="file" accept="application/json,.json" hidden />
          </div>
          <span class="footer-note">Saved on this device · works offline</span>
        </footer>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="./app.js" defer></script>
  </body>
</html>
